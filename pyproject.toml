[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lektor"
version = "0.1.0"
description = "Nieoficjalny polski lektor TTS do Descent: Legends of the Dark"
requires-python = ">=3.12"
# Zależności (UnityPy, numpy, soundfile, librosa, transformers, torch) są w .venv projektu (D12),
# instalowane osobno, żeby instalacja pakietu nie zmieniała wersji torch/CUDA.
dependencies = []

[project.scripts]
lektor = "lektor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lektor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
