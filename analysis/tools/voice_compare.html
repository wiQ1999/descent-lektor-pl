<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<!-- Szablon arkusza E11 (voice_compare.py sheet). Gotowe strony z tekstami i audio gry leżą tylko w analysis/work/. -->
<style>
:root { --bg: #f6f5f2; --card: #fff; --ink: #1d1d1b; --muted: #6b6a66; --line: #dddad3; --accent: #8a4b16; --ok: #2f6b3a; --bad: #9b2c2c; }
@media (prefers-color-scheme: dark) { :root { --bg: #1b1a18; --card: #262522; --ink: #ecebe7; --muted: #a3a19b; --line: #3a3833; --accent: #e0a060; --ok: #79c08a; --bad: #e08080; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 16px; }
nav { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--card); position: sticky; top: 0; z-index: 2; }
nav a { color: var(--accent); text-decoration: none; } nav a.on { font-weight: 700; color: var(--ink); }
h1 { font-size: 22px; margin: 8px 0 4px; } h2 { font-size: 18px; margin: 0 0 6px; }
.muted { color: var(--muted); } .small { font-size: 13px; }
section.voice { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin: 16px 0; overflow: hidden; }
.head { display: flex; gap: 14px; align-items: flex-start; }
.head img { height: 150px; border-radius: 8px; background: #bbb; flex: none; }
.head ol { margin: 4px 0; padding-left: 20px; }
.clips { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; margin-top: 10px; }
.clip { border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.clip h3 { font-size: 15px; margin: 0 0 6px; }
audio { width: 100%; height: 36px; }
.rate { display: flex; align-items: center; gap: 4px; margin: 6px 0 2px; flex-wrap: wrap; }
.rate span { min-width: 88px; } .rate label { padding: 2px 7px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
.rate input { display: none; } .rate input:checked + b { color: var(--accent); }
.rate label:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
input.note { width: 100%; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink); }
.reveal { display: none; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 13px; }
body.revealed .reveal { display: block; }
.reveal table { border-collapse: collapse; } .reveal td { padding: 1px 8px 1px 0; }
.bad { color: var(--bad); } .ok { color: var(--ok); }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 16px 0; }
button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--accent); background: var(--card); color: var(--ink); cursor: pointer; }
button.main { background: var(--accent); color: var(--bg); }
table.costs { border-collapse: collapse; width: 100%; background: var(--card); font-size: 14px; }
table.costs th, table.costs td { border: 1px solid var(--line); padding: 5px 8px; text-align: right; } table.costs th:first-child, table.costs td:first-child { text-align: left; }
.wrap { overflow-x: auto; }
ul.pages li { margin: 4px 0; }
@media (max-width: 600px) { .head { flex-direction: column; } .head img { height: 120px; } }
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="main"></main>
<script type="application/json" id="data">__DATA__</script>
<script>
const P = JSON.parse(document.getElementById('data').textContent);
const KEY = 'lektor-e11:';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
function load(page) {
  try { return JSON.parse(localStorage.getItem(KEY + page)) || {ratings: {}, revealed: false}; }
  catch (e) { return {ratings: {}, revealed: false}; }
}
function save(page, st) {
  st.ts = new Date().toISOString();
  try { localStorage.setItem(KEY + page, JSON.stringify(st)); } catch (e) {}
}
function rated(page) {
  const st = load(page); let n = 0;
  for (const v of Object.values(st.ratings)) for (const r of Object.values(v)) if (r.score) n++;
  return n;
}
function allRatings() {
  const out = {};
  for (const n of P.nav) out[n.page] = load(n.page);
  return {stage: 'E11', exported: new Date().toISOString(), pages: out};
}
function download() {
  const blob = new Blob([JSON.stringify(allRatings(), null, 1)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'e11_oceny.json'; a.click();
}
function copy() {
  const text = JSON.stringify(allRatings());
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(
    () => flash('Skopiowano oceny do schowka.'), () => flash('Schowek niedostępny: użyj „Pobierz oceny”.'));
}
function flash(msg) { const el = document.getElementById('msg'); if (el) el.textContent = msg; }

const page = P.mode === 'page' ? P.data.page : null;
document.getElementById('nav').innerHTML = '<a href="index.html"' + (page ? '' : ' class="on"') + '>Start</a>' +
  P.nav.map(n => `<a href="${n.page}.html"${n.page === page ? ' class="on"' : ''}>${esc(n.page)} · ${esc(n.title)}</a>`).join('');

const fmt = {
  cer: v => `${(v * 100).toFixed(1)}%`, tail_cut: v => v ? '<span class="bad">tak</span>' : '<span class="ok">nie</span>',
  missing: v => v >= 2 ? `<span class="bad">${v} słowa</span>` : String(v), sim: v => v == null ? '—' : v.toFixed(3),
  sim_preview: v => v.toFixed(3), rate: v => `${String(v).replace('.', ',')} kr./znak`,
  cps_ratio: v => v.toFixed(2), pause: v => `${Number(v).toFixed(2)} s`, speech_s: v => `${Number(v).toFixed(1)} s`, f0: v => v == null ? '—' : `${v} Hz`};
const names = {cer: 'CER (błędy ASR)', tail_cut: 'ucięta końcówka', missing: 'brak słów z rzędu', sim: 'barwa wobec referencji', sim_preview: 'barwa wobec wzorca z rundy 1', rate: 'koszt',
  cps_ratio: 'tempo wobec lektora', pause: 'najdłuższa pauza', speech_s: 'długość mowy', f0: 'wysokość (F0)'};

function scale(voice, id, field, label, value) {
  return `<div class="rate"><span>${label}</span>` + [1, 2, 3, 4, 5].map(k =>
    `<label><input type="radio" name="${voice}-${id}-${field}" value="${k}" data-v="${voice}" data-c="${id}" data-f="${field}"${value == k ? ' checked' : ''}><b>${k}</b></label>`).join('') + '</div>';
}

function renderPage() {
  const d = P.data, st = load(page);
  if (st.revealed) document.body.classList.add('revealed');
  const dubbed = d.voices[0].kind === 'dubbed';
  let h = `<h1>${esc(d.title)}</h1>`;
  h += d.intro ? `<p class="muted">${esc(d.intro)}</p>` : dubbed
    ? '<p class="muted">Oryginał z gry to referencja głosu z dubbingu (inny tekst niż kwestie). OmniVoice czyta obie kwestie postaci. Oceń, jak bardzo głos OmniVoice przypomina oryginał i jak dobrze brzmi jako lektor (1 = źle, 5 = bardzo dobrze).</p>'
    : '<p class="muted">Każda próbka czyta te same dwie kwestie. Kolejność A–D jest losowa: jedna to obecny głos OmniVoice, trzy to warianty ElevenLabs z różnych opisów postaci. Oceń, jak dobrze głos pasuje do postaci i brzmi po polsku (1 = źle, 5 = bardzo dobrze). Po ocenie odsłoń etykiety.</p>';
  for (const v of d.voices) {
    const r = st.ratings[v.voice] || {};
    h += `<section class="voice"><div class="head">${v.portrait ? `<img src="${v.portrait}" alt="">` : ''}<div><h2>${esc(v.name)}</h2>`;
    h += '<ol>' + v.lines.map(t => `<li>${esc(t)}</li>`).join('') + '</ol>';
    if (v.problems.length) h += `<p class="small bad">Automat zgłosił w nagraniu OmniVoice: ${esc(v.problems.join(', '))} (innej kwestii tej postaci w M2 nie ma).</p>`;
    h += '</div></div><div class="clips">';
    for (const c of v.clips) {
      const cr = r[c.id] || {};
      const blind = v.kind !== 'dubbed' && c.id !== 'orig';
      const title = blind ? `Próbka ${c.id}` : esc(c.label);
      h += `<div class="clip"><h3>${title}</h3><audio controls preload="none" src="${c.file}"></audio>`;
      if (c.id !== 'orig') {
        if (v.kind === 'dubbed') h += scale(v.voice, c.id, 'sim', 'Podobieństwo', cr.sim);
        h += scale(v.voice, c.id, 'score', v.kind === 'dubbed' ? 'Jakość' : 'Ocena', cr.score);
        h += `<input class="note" placeholder="Notatka (opcjonalnie)" data-v="${v.voice}" data-c="${c.id}" value="${esc(cr.note || '')}">`;
      }
      h += '<div class="reveal">';
      if (blind) h += `<b>${esc(c.label)}</b>`;
      if (c.desc) h += `<p class="small muted">${esc(c.desc)}</p>`;
      h += '<table>' + Object.keys(fmt).filter(k => c.metrics[k] !== undefined).map(k =>
        `<tr><td class="muted">${names[k]}</td><td>${fmt[k](c.metrics[k])}</td></tr>`).join('') + '</table></div></div>';
    }
    h += '</div></section>';
  }
  h += `<div class="bar"><button class="main" id="reveal">Odsłoń etykiety i wyniki automatu</button><button id="dl">Pobierz oceny (JSON)</button><button id="cp">Kopiuj oceny</button><span id="msg" class="muted small"></span></div>`;
  h += '<p class="small muted">Barwa wobec referencji: dla postaci z dubbingiem względem oryginału, dla pozostałych względem obecnego głosu OmniVoice. Oceny zapisują się w przeglądarce; przycisk pobierania zbiera oceny ze wszystkich stron.</p>';
  document.getElementById('main').innerHTML = h;

  const update = (el, fn) => {
    const s = load(page), v = el.dataset.v, c = el.dataset.c;
    s.ratings[v] = s.ratings[v] || {}; s.ratings[v][c] = s.ratings[v][c] || {};
    fn(s.ratings[v][c]); s.ratings[v][c].blind = !s.revealed && (s.ratings[v][c].blind !== false);
    save(page, s); flash(`Zapisano. Ocenione próbki na tej stronie: ${rated(page)}.`);
  };
  document.querySelectorAll('.rate input').forEach(el => el.addEventListener('change', () => update(el, o => { o[el.dataset.f] = Number(el.value); })));
  document.querySelectorAll('input.note').forEach(el => el.addEventListener('change', () => update(el, o => { o.note = el.value; })));
  document.getElementById('reveal').onclick = () => {
    const total = P.nav.find(n => n.page === page).ratable, done = rated(page);
    if (done < total && !confirm(`Ocenione ${done} z ${total} próbek. Odsłonić mimo to?`)) return;
    const s = load(page); s.revealed = true; save(page, s); document.body.classList.add('revealed');
  };
  document.getElementById('dl').onclick = download;
  document.getElementById('cp').onclick = copy;
}

function renderIndex() {
  const c = P.costs;
  let h = '<h1>E11 · Arkusz porównawczy głosów</h1>';
  h += '<p>Arkusz ma odpowiedzieć, którego modelu użyć dla narratora, bohaterów z głosem z gry i pozostałych postaci: lokalnego OmniVoice czy ElevenLabs. Strony <b>a1–a3</b> porównują dubbing z OmniVoice. Strony <b>b1–b2</b> porównują obecny głos OmniVoice z trzema wariantami ElevenLabs (na ślepo). Strony <b>c1–c2</b> (runda 2) porównują cztery modele TTS ElevenLabs tym samym głosem (na ślepo).</p>';
  h += '<ol><li>Słuchaj w słuchawkach, każdą stronę od góry.</li><li>Oceń próbki w skali 1–5, notatka jest opcjonalna.</li><li>Na końcu strony odsłoń etykiety i wyniki automatu.</li><li>Po ostatniej stronie kliknij „Pobierz oceny” i zapisz plik <code>e11_oceny.json</code> w <code>analysis/work/compare/e11/</code> (albo podaj, gdzie jest).</li></ol>';
  h += '<ul class="pages">' + P.nav.map(n => `<li><a href="${n.page}.html">${esc(n.page)} · ${esc(n.title)}</a> <span class="muted small">ocenione ${rated(n.page)} z ${n.ratable}${load(n.page).revealed ? ', odsłonięte' : ''}</span></li>`).join('') + '</ul>';
  const num = x => Math.round(x).toLocaleString('pl-PL');
  h += '<h2>Koszt syntezy</h2><p class="small muted">Znaki tekstu po normalizacji. Cała gra (D02) w proporcjach grup z M2. Limit konta Creator: ' + num(c.limit) + ' kr. na okres.</p><div class="wrap"><table class="costs"><tr><th>Model</th><th>kr./znak</th>' +
    c.groups.map(g => `<th>M2: ${esc(g[0])}<br><span class="muted small">${num(g[1])} zn.</span></th>`).join('') +
    `<th>M2 razem<br><span class="muted small">${num(c.m2_chars)} zn.</span></th><th>Cała gra<br><span class="muted small">${num(c.game_chars)} zn.</span></th><th>Okresy limitu (cała gra)</th></tr>`;
  for (const [model, rate, note] of c.rates) {
    h += `<tr><td>${esc(model)}<br><span class="muted small">${esc(note)}</span></td>`;
    if (rate === 0) h += `<td>0</td><td colspan="${c.groups.length}">bez kredytów</td><td>ok. ${c.m2_gpu_h} h GPU</td><td>ok. ${c.game_gpu_h} h GPU</td><td>—</td></tr>`;
    else if (rate == null) h += `<td>?</td><td colspan="${c.groups.length + 3}" class="muted">stawka po 2. rundzie</td></tr>`;
    else h += `<td>${String(rate).replace('.', ',')}</td>` + c.groups.map(g => `<td>${num(g[1] * rate)}</td>`).join('') +
      `<td>${num(c.m2_chars * rate)}</td><td>${num(c.game_chars * rate)}</td><td>${(c.game_chars * rate / c.limit).toFixed(1).replace('.', ',')}</td></tr>`;
  }
  h += '</table></div>';
  h += '<div class="bar"><button id="dl">Pobierz oceny (JSON)</button><button id="cp">Kopiuj oceny</button><span id="msg" class="muted small"></span></div>';
  document.getElementById('main').innerHTML = h;
  document.getElementById('dl').onclick = download;
  document.getElementById('cp').onclick = copy;
}

P.mode === 'page' ? renderPage() : renderIndex();
</script>
</body>
</html>
